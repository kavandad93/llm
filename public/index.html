<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kavandad LLM Panel</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="logo">K</span><div><b>Kavandad LLM</b><small>Local AI Control Panel</small></div></div>
      <button class="nav active" data-tab="chat">💬 چت</button>
      <button class="nav" data-tab="settings">⚙️ تنظیمات مدل</button>
      <button class="nav" data-tab="api">🔌 API</button>
      <div class="side-status"><span id="dot"></span><span id="statusText">در حال بررسی...</span></div>
    </aside>

    <main>
      <header>
        <div><h1 id="title">چت با مدل</h1><span id="modelBadge">kavandad-llm</span></div>
        <button id="clearBtn" class="ghost">پاک کردن چت</button>
      </header>

      <section id="chat" class="tab active">
        <div id="messages" class="messages">
          <div class="welcome">
            <div class="big">🤖</div>
            <h2>سلام! به Kavandad LLM خوش آمدی</h2>
            <p>این رابط فقط از API محلی استفاده می‌کند.</p>
          </div>
        </div>
        <form id="chatForm" class="composer">
          <textarea id="input" rows="2" placeholder="پیامت را بنویس..." autocomplete="off"></textarea>
          <button>ارسال ➤</button>
        </form>
      </section>

      <section id="settings" class="tab">
        <div class="card">
          <h2>تنظیمات اصلی</h2>
          <label>نام مدل<input id="model" value="kavandad-llm"></label>
          <label>Temperature <output id="tempOut">0.70</output><input id="temperature" type="range" min="0" max="2" step="0.05" value="0.7"></label>
          <label>Max tokens<input id="maxTokens" type="number" min="1" max="8192" value="256"></label>
          <label>System prompt<textarea id="systemPrompt" rows="5">You are a helpful local AI assistant.</textarea></label>
          <button id="saveSettings">ذخیره تنظیمات</button>
        </div>
      </section>

      <section id="api" class="tab">
        <div class="card">
          <h2>اتصال API</h2>
          <label>API Base URL<input id="apiUrl" value="http://127.0.0.1:3000"></label>
          <div class="actions">
            <button id="testBtn">تست اتصال</button>
            <button id="modelsBtn" class="ghost">دریافت مدل‌ها</button>
          </div>
          <pre id="apiResult">هنوز تست نشده.</pre>
          <h3>Endpoints</h3>
          <code>GET /health</code>
          <code>GET /v1/models</code>
          <code>POST /v1/chat/completions</code>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
